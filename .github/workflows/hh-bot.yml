name: hh-bot
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hh-bot
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python hh_bot.py
        env:
          RUN_ONCE: "1"
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          HH_TOKEN: ${{ secrets.HH_TOKEN }}
          CONTACT: ${{ secrets.CONTACT }}
      - name: Save seen
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add seen.json
          git diff --staged --quiet || (git commit -m "seen" && git push)
